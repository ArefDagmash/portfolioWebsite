<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Intro letter spawn test</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F5F5F7;
    }

    .name {
        display: flex;
        align-items: flex-end;
    }

    .name img {
        height: 22vw;
        max-height: 280px;
        opacity: 0;
        transform: translateY(24px) scale(0.85);
        animation: spawn 0.6s ease-out forwards;
    }

    .name img:nth-child(1) { animation-delay: 0s; }
    .name img:nth-child(2) { animation-delay: 0.35s; margin-left: -1.2vw; }
    .name img:nth-child(3) { animation-delay: 0.7s; margin-left: -1.2vw; }
    .name img:nth-child(4) { animation-delay: 1.05s; margin-left: -1.2vw; }

    @keyframes spawn {
        0% {
            opacity: 0;
            transform: translateY(24px) scale(0.85);
        }
        60% {
            opacity: 1;
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }
</style>
</head>
<body>
    <div class="name">
        <img src="A.excalidraw.svg" alt="A">
        <img src="r.excalidraw.svg" alt="r">
        <img src="e.excalidraw.svg" alt="e">
        <img src="f.excalidraw.svg" alt="f">
    </div>
</body>
</html>
